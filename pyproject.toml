[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idempotent-moe"
version = "0.1.0"
description = "Zero-Copy Sparse MoE Dynamic Token Router for Deep Learning Accelerators"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dr. A. Emre ÇETİN", email = "aemre.cetin@gmail.com" }
]
keywords = [
    "moe", "mixture-of-experts", "token-routing", "triton", "cuda", "memory-compaction", 
    "zero-copy", "idempotent", "in-situ", "mixtral", "deepseek", "inference-acceleration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "torch>=2.0.0",
    "triton>=2.1.0; platform_system != 'Windows'",
    "triton-windows>=3.0.0; platform_system == 'Windows'"
]

[project.urls]
Homepage = "https://github.com/aemre-cetin/idempotent-moe"
Repository = "https://github.com/aemre-cetin/idempotent-moe"
Documentation = "https://github.com/aemre-cetin/idempotent-moe#readme"

[tool.setuptools.packages.find]
where = ["src"]
